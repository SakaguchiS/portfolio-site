<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Saki Sakaguchi</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="site-header">
            <a href="#top">Saki Sakaguchi</a>
            <nav>
                <a href="#about">About</a>
                <a href="#works">Works</a>
            </nav>
        </header>
        <main>
            <section id="top">
                <img src="./media/top_s.jpg" width="80%">
                <h1>
                    Saki Sakaguchi<br>
                    Portfolio
                </h1>
                <p id="weather-icon">　</p>
            </section>
            <section id="about">
                <h3>About</h3>
                <p>
                    阪口 紗季<br>
                    東京都市大学デザイン・データ科学部
                </p>
                <p>
                    専門：UX/UI、インタラクションデザイン<br>
                    スキル：HTML/CSS/Processing/Arduino/Illustrator/Python/Unity/Figma
                </p>
            </section>
            <section id="works" class="works">
                <h3>Works</h3>
                <div class="works-controls">
                    <select id="category">
                        <option value="all">すべてのカテゴリ</option>
                    </select>
                    <select id="sort">
                        <option value="new">新しい順</option>
                        <option value="old">古い順</option>
                        <option value="title">タイトル順</option>
                    </select>
                </div>
                <div id="works-grid"></div>
            </section>
        </main>
        <footer>
            <span>©️ 2026 Saki Sakaguchi</span>
        </footer>

        <script src="works.js"></script>
    </body>
</html>
